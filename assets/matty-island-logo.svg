<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 200 200"><rect width="200" height="200" fill="#0F1E36"/>
      <defs>
        <linearGradient id="sun4" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFD97A"/><stop offset="1" stop-color="#FF7E5E"/>
        </linearGradient>
        <linearGradient id="gold4" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#E3C98A"/><stop offset="1" stop-color="#C9A24B"/>
        </linearGradient>
        <clipPath id="sunClip"><circle cx="74" cy="88" r="32"/></clipPath>

        <!-- ONE graceful frond, pointing right: gentle rise, drooping tip -->
        <path id="frond" d="M0 0 C 16 -12, 38 -15, 56 -7 C 58 -6, 58 -5, 56 -5 C 40 -6, 20 -1, 4 7 C 1 8, -1 4, 0 0 Z"/>
        <!-- upper frond: same sweep but the tip curls UP a little -->
        <path id="frondUp" d="M0 0 C 15 -13, 34 -19, 48 -17 C 50 -17, 50 -15, 48 -14 C 34 -12, 17 -4, 4 6 C 1 7, -1 4, 0 0 Z"/>

        <!-- the full palm: trunk + fountain crown, every frond ARCS (none vertical) -->
        <g id="palm">
          <!-- trunk: smooth lean toward the sun -->
          <path d="M130 130 C 137 112, 139 96, 135 80 L 139 77 C 144 94, 143 112, 135 130 Z"/>
          <!-- crown at (137,78) -->
          <g transform="translate(137,78)">
            <use href="#frondUp" transform="rotate(18) scale(0.54)"/>
            <use href="#frond" transform="rotate(38) scale(0.58)"/>
            <use href="#frondUp" transform="scale(-1,1) rotate(18) scale(0.54)"/>
            <use href="#frond" transform="scale(-1,1) rotate(38) scale(0.58)"/>
          </g>
        </g>
      </defs>

      <rect x="5" y="5" width="190" height="190" rx="22" fill="none" stroke="url(#gold4)" stroke-width="3"/>
      <g transform="translate(0,-10) scale(0.92) translate(8,8)">
        <!-- sun -->
        <circle cx="74" cy="88" r="32" fill="url(#sun4)"/>

        <!-- waves (moved down, as locked earlier) -->
        <g stroke="#0F1E36" stroke-width="10" fill="none" stroke-linecap="round">
          <path d="M28 126 Q63 110 98 126 Q133 142 168 126"/>
          <path d="M36 148 Q67 134 98 148 Q129 162 160 148"/>
        </g>
        <g fill="none" stroke-linecap="round">
          <path d="M28 132 Q63 116 98 132 Q133 148 168 132" stroke="#E3C98A" stroke-width="6"/>
          <path d="M36 154 Q67 140 98 154 Q129 168 160 154" stroke="#C9A24B" stroke-width="6"/>
        </g>

        <!-- palm: gold everywhere... -->
        <use href="#palm" fill="url(#gold4)"/>
        <!-- ...but NAVY where it crosses the sun (clean eclipse look) -->
        <g clip-path="url(#sunClip)">
          <use href="#palm" fill="#0F1E36"/>
        </g>
      </g>

      <text x="100" y="182" text-anchor="middle" font-family="Montserrat, Arial" font-size="12.5" font-weight="700" fill="#F0DCA4" letter-spacing="5">MATTY ISLAND</text>
    </svg>